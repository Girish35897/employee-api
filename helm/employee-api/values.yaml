replicaCount: 1

image:
  repository: employee-management-api
  pullPolicy: Never
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: employee-api.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

env:
  ENVIRONMENT_NAME: "development"
  PLATFORM_TEAM: "Platform Engineering"
  RELEASE_VERSION: "1.0.0"